name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/best-shot-picker-v0.1-20261016
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/embedding/**"
      - "package*.json"
      - "scripts/**"
      - "app.config.json"
      - "dependencies.json"
      - "dependencies.lock.json"
      - "schemas/dependencies*.json"
      - ".github/workflows/dependency-updates.yml"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - "scripts/build-self-extract.ps1"
      - "scripts/verify-self-extract.ps1"
      - ".github/workflows/build-standalone.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            *.html
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:grouping
      - run: npx playwright install --with-deps chromium
      - name: Build standalone files with the canonical PowerShell builder
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsp-bin"
          ln -s "$(command -v tar)" "$RUNNER_TEMP/bsp-bin/tar.exe"
          export PATH="$RUNNER_TEMP/bsp-bin:$PATH"
          pwsh -NoLogo -NoProfile -File scripts/check-powershell-syntax.ps1
          pwsh -NoLogo -NoProfile -File scripts/check-repository.ps1
      - name: Acquire the fixed consented adult-photo corpus for local-file parity only
        run: python experiments/face-detection/photo-acquire.py --acquire
      - run: npm run test:browser
        env:
          BSP_FACE_LONDON_PARITY: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          retention-days: 14

  cross-engine-core:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify bounded cross-engine core flows
        run: npm run test:cross-engine
        env:
          BSP_BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-engine-${{ matrix.engine }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/cross-engine/
          if-no-files-found: warn
          retention-days: 14

  embedding-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build isolated pinned offline embedding experiment
        run: npm run experiment:embedding:build
      - name: Wrap experiment with the canonical self-extract builder
        shell: pwsh
        run: |
          ./scripts/check-powershell-syntax.ps1
          ./scripts/build-self-extract.ps1 -InputPath test-results/embedding/index.html -OutputPath test-results/embedding/index.self-extract.html -AppName "Embedding feasibility experiment" -AppNameJa "Embedding feasibility experiment"
      - name: Measure offline inference and fallback; retain adoption gates
        run: npm run experiment:embedding:test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: embedding-feasibility-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/embedding/*.json
            test-results/embedding/*.png
          retention-days: 14

  tfjs-alternative:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build isolated pinned TFJS candidate and licensed photo pilot
        run: npm run experiment:tfjs:build
      - name: Wrap both experiments with unchanged canonical CSP
        shell: pwsh
        run: |
          ./scripts/check-powershell-syntax.ps1
          ./scripts/build-self-extract.ps1 -InputPath test-results/embedding-tfjs/index.html -OutputPath test-results/embedding-tfjs/index.self-extract.html
          ./scripts/verify-self-extract.ps1 -Path test-results/embedding-tfjs/index.self-extract.html -ExpectedSourcePath test-results/embedding-tfjs/index.html
          ./scripts/build-self-extract.ps1 -InputPath test-results/embedding-tfjs/photo-pilot.html -OutputPath test-results/embedding-tfjs/photo-pilot.self-extract.html
          ./scripts/verify-self-extract.ps1 -Path test-results/embedding-tfjs/photo-pilot.self-extract.html -ExpectedSourcePath test-results/embedding-tfjs/photo-pilot.html
      - name: Compare runtime, restrictive CSP, and held-out photo groups
        run: npm run experiment:tfjs:test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tfjs-alternative-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/embedding-tfjs/*.json
            test-results/embedding-tfjs/*.png
          retention-days: 14

  external-burst-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r experiments/embedding/burst-render.requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Acquire only hash-pinned public burst frames and render fixed derivatives
        run: npm run experiment:burst:acquire
      - name: Build frozen external holdout, isolated from product distribution
        run: npm run experiment:burst:build
      - name: Wrap with unchanged canonical CSP
        shell: pwsh
        run: |
          ./scripts/check-powershell-syntax.ps1
          ./scripts/build-self-extract.ps1 -InputPath test-results/embedding-burst/index.html -OutputPath test-results/embedding-burst/index.self-extract.html
          ./scripts/verify-self-extract.ps1 -Path test-results/embedding-burst/index.self-extract.html -ExpectedSourcePath test-results/embedding-burst/index.html
      - name: Measure frozen grouping, sequential costs, and model-failure fallback
        run: npm run experiment:burst:test
      - name: Build isolated off-main-thread adapter using the same frozen assets
        run: npm run experiment:worker:build
      - name: Wrap worker experiment with unchanged canonical CSP
        shell: pwsh
        run: |
          ./scripts/build-self-extract.ps1 -InputPath test-results/embedding-worker/index.html -OutputPath test-results/embedding-worker/index.self-extract.html
          ./scripts/verify-self-extract.ps1 -Path test-results/embedding-worker/index.self-extract.html -ExpectedSourcePath test-results/embedding-worker/index.html
      - name: Verify worker parity, cancellation, cleanup and responsiveness
        run: npm run experiment:worker:test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: external-burst-holdout-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/embedding-burst/*.json
            test-results/embedding-worker/*.json
          retention-days: 14
