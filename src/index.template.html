<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f2">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Best Shot Picker</title>
  <link rel="icon" href="__APP_ICON_DATA_URI__">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f2;
      --surface: #ffffff;
      --surface-muted: #f0f0ed;
      --surface-hover: #e9e9e5;
      --text: #20211f;
      --muted: #666963;
      --line: #dadbd6;
      --line-strong: #bfc1ba;
      --accent: #16624f;
      --accent-hover: #0e503f;
      --accent-soft: #e1f0ea;
      --danger: #b3261e;
      --focus: #4d8bc7;
      --shadow-sm: 0 1px 2px rgba(25, 28, 24, .08), 0 1px 6px rgba(25, 28, 24, .04);
      --shadow-md: 0 12px 34px rgba(25, 28, 24, .10);
      --radius: 12px;
      --header-height: 66px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, textarea, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible, .image-viewport:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent);
      outline-offset: 2px;
    }
    .app-header {
      position: sticky;
      z-index: 30;
      top: 0;
      min-height: var(--header-height);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(16px) saturate(1.2);
    }
    .header-inner {
      width: min(1180px, 100%);
      min-height: var(--header-height);
      margin: 0 auto;
      padding: 10px clamp(14px, 2.8vw, 30px);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      display: block;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border-radius: 11px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .review-navigation{margin-bottom:12px;padding:10px;border:1px solid var(--line);border-radius:8px}.review-navigation p{margin:0 0 8px}.review-navigation p:last-child{margin-bottom:0}.review-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.review-actions .button{flex:1;min-width:0;min-height:44px;font-size:12px;padding:8px;overflow-wrap:anywhere}
    .brand-mark img { width: 100%; height: 100%; display: block; }
    .brand-copy { min-width: 0; }
    .brand-name {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
      letter-spacing: .01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .version-badge {
      display: inline-flex;
      align-items: center;
      margin-left: 7px;
      padding: 1px 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-muted);
      font-size: 10px;
      font-weight: 650;
      vertical-align: 2px;
    }
    .brand-meta {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .button {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .button:hover { border-color: var(--line-strong); background: var(--surface-hover); }
    .button:active { transform: translateY(1px); }
    .language-button {
      min-width: 0;
      padding: 5px 1px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .02em;
      cursor: pointer;
      transition: color .16s ease, opacity .16s ease;
    }
    .language-button:hover { color: var(--text); }
    .language-button:active { opacity: .65; }
    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .icon-button:hover { border-color: var(--line-strong); background: var(--surface-hover); }
    .icon-button:active { transform: translateY(1px); }
    .icon-button svg { width: 18px; height: 18px; display: block; }
    .header-icon-button {
      width: auto;
      height: auto;
      padding: 5px 1px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      transition: color .16s ease, opacity .16s ease;
    }
    .header-icon-button:hover { border-color: transparent; background: transparent; color: var(--text); }
    .header-icon-button:active { transform: none; opacity: .65; }
    .header-icon-button svg { width: 20px; height: 20px; }
    .main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 22px clamp(14px, 2.8vw, 30px) 54px;
    }
    .page-intro {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 0 2px 18px;
    }
    .page-intro h2 {
      margin: 0;
      font-size: clamp(21px, 3vw, 26px);
      line-height: 1.3;
      letter-spacing: -.025em;
    }
    .page-intro p { margin: 5px 0 0; max-width: 760px; color: var(--muted); font-size: 13px; }
    .local-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      margin-top: 3px;
      padding: 7px 10px;
      border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--line));
      border-radius: 999px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .local-badge svg { width: 15px; height: 15px; display: block; }
    .workspace {
      margin: 0 0 28px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .workspace-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 15px; }
    .workspace h2, .section-title { margin: 0; letter-spacing: -.02em; }
    .workspace h2 { font-size: 19px; }
    .workspace-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .stats { display: flex; flex-wrap: wrap; gap: 7px; }
    .stat { min-width: 70px; padding: 7px 10px; border-radius: 10px; background: var(--surface-muted); text-align: center; }
    .stat-value { display: block; font-size: 15px; font-weight: 780; line-height: 1.2; }
    .stat-label { color: var(--muted); font-size: 10px; }
    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      background: #fbfbf9;
      color: var(--text);
      line-height: 1.7;
    }
    textarea:hover { border-color: var(--line-strong); }
    .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .button { min-height: 40px; padding: 8px 14px; font-weight: 700; }
    .button.primary { border-color: var(--accent); color: white; background: var(--accent); }
    .button.primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    .button.danger { color: var(--danger); }
    .save-status { align-self: center; color: var(--muted); font-size: 12px; }
    .export-row { display: flex; align-items: end; gap: 10px; margin-top: 12px; }
    .export-field { display: grid; gap: 5px; min-width: min(100%, 320px); }
    .export-label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .filename-control { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .filename-control:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
    .filename-input { width: 100%; min-width: 0; min-height: 40px; padding: 8px 10px; border: 0; outline: 0; background: transparent; color: var(--text); }
    .filename-extension { padding: 0 10px; color: var(--muted); font-size: 12px; user-select: none; }
    .section { padding: 26px 0; }
    .section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 15px; }
    .section-title { font-size: 20px; }
    .section-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .card-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .card { min-height: 150px; padding: 17px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-sm); }
    .card-number { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .card h3 { margin: 17px 0 6px; font-size: 15px; }
    .card p { margin: 0; color: var(--muted); font-size: 12px; }
    details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow-sm); }
    summary { cursor: pointer; padding: 14px 16px; font-weight: 720; }
    .build-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px 16px; }
    .build-item { padding: 11px; border-radius: 10px; background: var(--surface-muted); }
    .build-item span { display: block; color: var(--muted); font-size: 10px; }
    .build-item strong { display: block; overflow-wrap: anywhere; font-size: 12px; }
    footer { width: min(1180px, 100%); margin: 0 auto; padding: 0 clamp(14px, 2.8vw, 30px) 34px; color: var(--muted); font-size: 12px; }
    /* Reusable toast / Undo component. Canonical source: components/toast.html */
    .app-toast {
      position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 60;
      display: flex; align-items: center; gap: 12px; max-width: min(420px, calc(100vw - 36px));
      padding: 10px 12px 10px 14px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface); color: var(--text); box-shadow: var(--shadow-md); opacity: 0;
      transform: translateY(12px); pointer-events: none; transition: opacity .18s ease, transform .18s ease;
    }
    .app-toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .app-toast[data-tone="success"] { border-color: color-mix(in srgb, var(--accent) 34%, var(--line)); }
    .app-toast[data-tone="warning"] { border-color: #c58a24; }
    .app-toast-message { min-width: 0; flex: 1 1 auto; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
    .app-toast-action { flex: 0 0 auto; min-height: 34px; padding: 5px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--accent); font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
    .app-toast-action:hover { background: var(--surface-hover); }
    .app-toast-action[hidden] { display: none; }
    dialog {
      width: min(640px, calc(100% - 28px));
      max-height: min(760px, calc(100dvh - 28px));
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-md);
    }
    dialog::backdrop { background: rgba(15, 17, 14, .52); backdrop-filter: blur(4px); }
    #helpDialog[open], #groupDialog[open] {
      display: flex;
      flex-direction: column;
      max-height: calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    }
    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .dialog-header h2 { margin: 0; font-size: 17px; }
    .dialog-body {
      min-height: 0;
      flex: 1 1 auto;
      padding: 20px 20px calc(28px + env(safe-area-inset-bottom));
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .dialog-body h3 {
      margin: 25px 0 8px;
      padding-top: 19px;
      border-top: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
      font-size: 14px;
    }
    .dialog-body h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
    .dialog-body p, .dialog-body li { color: var(--muted); font-size: 13px; line-height: 1.7; }
    .dialog-body p { margin: 8px 0 0; }
    .dialog-body ul, .dialog-body ol { margin: 8px 0 0; padding-left: 22px; }
    .dialog-body li + li { margin-top: 7px; }
    .dialog-note {
      margin-top: 12px;
      padding: 11px 12px;
      border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--text) !important;
    }

    /* Reusable confirmation component. Canonical source: components/confirm-dialog.html */
    .app-confirm-dialog { width: min(420px, calc(100% - 24px)); max-width: 100%; }
    .app-confirm-dialog::backdrop { background: rgba(15, 17, 14, .48); backdrop-filter: blur(3px); }
    .app-confirm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px 13px;
      border-bottom: 1px solid var(--line);
    }
    .app-confirm-title { margin: 0; font-size: 17px; letter-spacing: -.01em; }
    .app-confirm-close {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    .app-confirm-close:hover { background: var(--surface-hover); }
    .app-confirm-close svg { width: 19px; height: 19px; }
    .app-confirm-body { padding: 18px; }
    .app-confirm-message {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .app-confirm-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 18px;
    }
    .app-confirm-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 760;
      cursor: pointer;
    }
    .app-confirm-button:hover { border-color: var(--line-strong); background: var(--surface-hover); }
    .app-confirm-button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .app-confirm-button.primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    .app-confirm-button.danger { border-color: var(--danger); background: var(--danger); color: #fff; }
    .app-confirm-button:focus-visible, .app-confirm-close:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent);
      outline-offset: 2px;
    }

    code { padding: 1px 5px; border-radius: 5px; background: var(--surface-muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 820px) {
      .page-intro { align-items: stretch; flex-direction: column; gap: 10px; }
      .local-badge { align-self: flex-start; }
      .workspace-head, .section-head { align-items: stretch; flex-direction: column; }
      .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .build-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      :root { --header-height: 58px; }
      .header-inner { padding-block: 8px; }
      .brand-mark { width: 34px; height: 34px; border-radius: 10px; }
      .brand-name { font-size: 15px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
      .version-badge { margin-left: 0; }
      .brand-meta { display: none; }
      .header-actions { gap: 11px; }
      .language-button { padding-block: 6px; }
      .header-icon-button { padding-block: 6px; }
      .main { padding-top: 18px; }
      .page-intro { padding-bottom: 14px; }
      .workspace { padding: 14px; border-radius: 14px; }
      .stats { width: 100%; }
      .stat { flex: 1 1 0; min-width: 0; }
      .card-grid { grid-template-columns: 1fr; }
      .toolbar, .button-row { width: 100%; }
      .button-row .button { flex: 1 1 auto; }
      .export-row, .export-field { width: 100%; }
      .app-toast { left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: none; }
      textarea { min-height: 235px; }
      #helpDialog, #groupDialog {
        width: calc(100% - 20px);
        max-height: calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
      #helpDialog .dialog-body, #groupDialog .dialog-body {
        padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
      }
      .app-confirm-dialog {
        width: 100%;
        max-width: none;
        margin: auto 0 0;
        border-width: 1px 0 0;
        border-radius: 22px 22px 0 0;
      }
      .app-confirm-dialog::backdrop { background: rgba(0, 0, 0, .42); backdrop-filter: blur(2px); }
      .app-confirm-header { padding: 14px 18px 12px; }
      .app-confirm-body { padding: 12px 18px calc(env(safe-area-inset-bottom) + 18px); }
      .app-confirm-message { font-size: 14px; line-height: 1.75; }
      .app-confirm-actions { grid-template-columns: 1fr; gap: 10px; margin-top: 16px; }
      .app-confirm-button { min-height: 48px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }

  :root {
    --app-mobile-bottom-bar-height: 74px;
    --app-mobile-bottom-accent: var(--accent, #16624f);
    --app-mobile-bottom-accent-soft: var(--accent-soft, #e1f0ea);
    --app-mobile-bottom-muted: var(--muted, #6b6f69);
    --app-mobile-bottom-line: var(--line, #dadbd6);
  }

  .app-mobile-bottom-bar {
    display: none;
  }

  /* Desktop keeps every page in normal document flow. */
  .app-mobile-page {
    display: block;
  }

  @media (max-width: 600px) {
    body.has-mobile-bottom-bar {
      padding-bottom: calc(var(--app-mobile-bottom-bar-height) + env(safe-area-inset-bottom));
    }

    /*
      Page-tab mode. Only use has-mobile-page-tabs when the mobile UX benefits
      from real page switching. The active class is managed by the helper.
    */
    body.has-mobile-page-tabs .app-mobile-page {
      display: none;
    }

    body.has-mobile-page-tabs .app-mobile-page.is-mobile-active {
      display: block;
    }

    .app-mobile-bottom-bar {
      position: fixed;
      z-index: 80;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(var(--app-mobile-bottom-items, 4), minmax(0, 1fr));
      gap: 4px;
      padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
      border-top: 1px solid color-mix(in srgb, var(--app-mobile-bottom-line) 82%, transparent);
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 -8px 24px rgba(20, 22, 20, .06);
      backdrop-filter: blur(18px) saturate(1.35);
    }

    .app-mobile-bottom-item {
      position: relative;
      min-width: 0;
      min-height: 54px;
      padding: 5px 4px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--app-mobile-bottom-muted);
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      font: inherit;
      font-size: 10px;
      font-weight: 750;
      line-height: 1.15;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .app-mobile-bottom-item svg {
      width: 21px;
      height: 21px;
    }

    .app-mobile-bottom-item span {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-mobile-bottom-item:hover,
    .app-mobile-bottom-item:focus-visible,
    .app-mobile-bottom-item.is-active,
    .app-mobile-bottom-item[aria-current="page"] {
      color: var(--app-mobile-bottom-accent);
      background: var(--app-mobile-bottom-accent-soft);
    }

    .app-mobile-bottom-item.primary:not(:disabled) {
      color: var(--app-mobile-bottom-accent);
      background: var(--app-mobile-bottom-accent-soft);
    }

    .app-mobile-bottom-item:disabled {
      opacity: .36;

<script>
(() => {
      const APP_CONFIG = __APP_CONFIG_JSON__;
      const BUILD_MANIFEST = __BUILD_MANIFEST_JSON__;
      // Asset payloads are Base64 exactly once. The JSON bundle itself is embedded directly.
      const assetBundle = __EMBEDDED_ASSET_BUNDLE_JSON__;
      const blobUrls = new Set();
      const assetByteCache = new Map();

      function decodeBase64Bytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        return bytes;
      }

      function getAsset(dependencyId, assetKey) {
        const asset = assetBundle.dependencies?.[dependencyId]?.assets?.[assetKey];
        if (!asset) throw new Error(`Embedded asset not found: ${dependencyId}/${assetKey}`);
        return asset;
      }

      async function inflateAsset(asset) {
        const stored = decodeBase64Bytes(asset.base64);
        if (!asset.compression || asset.compression === 'none') return stored;
        if (asset.compression !== 'gzip') throw new Error(`Unsupported embedded asset compression: ${asset.compression}`);
        if (typeof DecompressionStream !== 'function') throw new Error('This browser cannot expand gzip-compressed embedded assets.');
        const stream = new Blob([stored]).stream().pipeThrough(new DecompressionStream('gzip'));
        const expanded = new Uint8Array(await new Response(stream).arrayBuffer());
        if (Number.isFinite(asset.originalBytes) && expanded.byteLength !== asset.originalBytes) {
          throw new Error(`Embedded gzip asset size mismatch: expected ${asset.originalBytes}, got ${expanded.byteLength}`);
        }
        return expanded;
      }

      window.StandaloneAssets = Object.freeze({
        manifest: BUILD_MANIFEST,
        list() {
          return Object.entries(assetBundle.dependencies || {}).flatMap(([dependencyId, dependency]) =>
            Object.keys(dependency.assets || {}).map(assetKey => `${dependencyId}/${assetKey}`));
        },
        has(dependencyId, assetKey) {
          return Boolean(assetBundle.dependencies?.[dependencyId]?.assets?.[assetKey]);
        },
        bytes(dependencyId, assetKey) {
          const asset = getAsset(dependencyId, assetKey);
          if (asset.compression && asset.compression !== 'none') {
            throw new Error(`Embedded asset ${dependencyId}/${assetKey} is gzip-compressed; use await StandaloneAssets.bytesAsync().`);
          }
          return decodeBase64Bytes(asset.base64);
        },
        async bytesAsync(dependencyId, assetKey) {
          const cacheKey = `${dependencyId}/${assetKey}`;
          if (!assetByteCache.has(cacheKey)) assetByteCache.set(cacheKey, inflateAsset(getAsset(dependencyId, assetKey)));
          const pending = assetByteCache.get(cacheKey);
          try { return new Uint8Array(await pending); }
          catch (error) {
            // A rejected expansion must not poison future explicit retries.
            if (assetByteCache.get(cacheKey) === pending) assetByteCache.delete(cacheKey);
            throw error;
          }
        },
        text(dependencyId, assetKey) {
          return new TextDecoder().decode(this.bytes(dependencyId, assetKey));
        },
        async textAsync(dependencyId, assetKey) {
          return new TextDecoder().decode(await this.bytesAsync(dependencyId, assetKey));
        },
        blobUrl(dependencyId, assetKey) {
          const asset = getAsset(dependencyId, assetKey);
          const url = URL.createObjectURL(new Blob([this.bytes(dependencyId, assetKey)], { type: asset.mime || 'application/octet-stream' }));
          blobUrls.add(url);
          return url;
        },
        async blobUrlAsync(dependencyId, assetKey) {
          const asset = getAsset(dependencyId, assetKey);
          const url = URL.createObjectURL(new Blob([await this.bytesAsync(dependencyId, assetKey)], { type: asset.mime || 'application/octet-stream' }));
          blobUrls.add(url);
          return url;
        },
        async loadClassicScript(dependencyId, assetKey, globalName = '') {
          const sourceUrl = await this.blobUrlAsync(dependencyId, assetKey);
          try {
            await new Promise((resolve, reject) => {
              const script = document.createElement('script');
              script.src = sourceUrl;
              script.onload = resolve;
              script.onerror = () => reject(new Error(`Failed to load embedded script: ${dependencyId}/${assetKey}`));
              document.head.append(script);
            });
            return globalName ? window[globalName] : true;
          } finally {
            URL.revokeObjectURL(sourceUrl);
            blobUrls.delete(sourceUrl);
          }
        },
        async importModule(dependencyId, assetKey) {
          const sourceUrl = await this.blobUrlAsync(dependencyId, assetKey);
          try {
            return await import(sourceUrl);
          } finally {
            URL.revokeObjectURL(sourceUrl);
            blobUrls.delete(sourceUrl);
          }
        }
      });

      window.addEventListener('pagehide', () => {
        blobUrls.forEach(url => URL.revokeObjectURL(url));
        blobUrls.clear();
      });


})();
</script>
<script>

  (() => {
    'use strict';

    function mountMobileBottomBar(root, options = {}) {
      if (!(root instanceof HTMLElement)) throw new TypeError('A mobile bottom bar root element is required.');

      const actionHandlers = options.actions || {};
      const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
      const mobileQuery = window.matchMedia?.('(max-width: 600px)') || null;
      const buttons = Array.from(root.querySelectorAll('.app-mobile-bottom-item'));
      const pageButtons = buttons.filter(button => button.dataset.mobilePageTarget);
      let observer = null;
      let currentPageKey = null;

      function buttonByKey(key) {
        return buttons.find(button => button.dataset.mobileKey === key) || null;
      }

      function pageEntryByKeyOrId(keyOrId) {
        const button = pageButtons.find(candidate =>
          candidate.dataset.mobileKey === keyOrId || candidate.dataset.mobilePageTarget === keyOrId
        ) || null;
        if (!button) return null;
        const page = document.getElementById(button.dataset.mobilePageTarget);
        return page ? { button, page } : null;
      }

      function setActive(key) {
        for (const button of buttons) {
          const active = button.dataset.mobileKey === key;
          button.classList.toggle('is-active', active);
          if (button.dataset.mobileTarget || button.dataset.mobilePageTarget) {
            if (active) button.setAttribute('aria-current', 'page');
            else button.removeAttribute('aria-current');
          }
        }
      }

      function setEnabled(key, enabled) {
        const button = buttonByKey(key);
        if (!button) return false;
        button.disabled = !enabled;
        return true;
      }

      function showPage(keyOrId, showOptions = {}) {
        const entry = pageEntryByKeyOrId(keyOrId);
        if (!entry) return false;

        const key = entry.button.dataset.mobileKey || entry.button.dataset.mobilePageTarget;
        for (const button of pageButtons) {
          const page = document.getElementById(button.dataset.mobilePageTarget);
          page?.classList.toggle('is-mobile-active', button === entry.button);
        }

        currentPageKey = key;
        setActive(key);

        if (mobileQuery?.matches && showOptions.scroll !== false) {
          const topTarget = document.getElementById(options.pageTopTarget || '') || entry.page;
          const top = Math.max(0, topTarget.getBoundingClientRect().top + window.scrollY - (options.pageTopOffset || 0));
          window.scrollTo({ top, behavior: showOptions.behavior || (reduceMotion ? 'auto' : 'smooth') });
        }

        if (typeof options.onPageChange === 'function') {
          options.onPageChange({ key, page: entry.page, button: entry.button });
        }
        return true;
      }

      function ensureInitialPage() {
        if (!pageButtons.length) return;
        const preferred = options.initialPage
          ? pageEntryByKeyOrId(options.initialPage)
          : null;
        const marked = pageButtons.find(button => button.classList.contains('is-active')) || pageButtons[0];
        const entry = preferred || pageEntryByKeyOrId(marked.dataset.mobileKey || marked.dataset.mobilePageTarget);
        if (entry) showPage(entry.button.dataset.mobileKey || entry.button.dataset.mobilePageTarget, { scroll: false });
      }

      function clickHandler(event) {
        const button = event.target.closest('.app-mobile-bottom-item');
        if (!button || !root.contains(button) || button.disabled) return;

        const pageTargetId = button.dataset.mobilePageTarget;
        if (pageTargetId) {
          showPage(button.dataset.mobileKey || pageTargetId);
        }

        const targetId = button.dataset.mobileTarget;
        if (targetId) {
          const target = document.getElementById(targetId);
          if (target) {
            target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
            setActive(button.dataset.mobileKey || targetId);
          }
        }

        const actionName = button.dataset.mobileAction;
        const handler = actionName ? actionHandlers[actionName] : null;
        if (typeof handler === 'function') handler({ button, event });
      }

      root.addEventListener('click', clickHandler);
      ensureInitialPage();

      /* Section-scroll mode remains supported for older and action-heavy apps. */
      const targetButtons = buttons.filter(button => button.dataset.mobileTarget && !button.dataset.mobilePageTarget);
      if (options.observeSections !== false && !pageButtons.length && targetButtons.length && 'IntersectionObserver' in window) {
        const targets = targetButtons
          .map(button => ({ button, target: document.getElementById(button.dataset.mobileTarget) }))
          .filter(entry => entry.target);

        observer = new IntersectionObserver(entries => {
          const visible = entries
            .filter(entry => entry.isIntersecting)
            .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
          if (!visible) return;
          const match = targets.find(entry => entry.target === visible.target);
          if (match) setActive(match.button.dataset.mobileKey || match.button.dataset.mobileTarget);
        }, { rootMargin: '-30% 0px -55% 0px', threshold: [0, .01, .25, .5] });

        for (const entry of targets) observer.observe(entry.target);
      }

      return Object.freeze({
        setActive,
        setEnabled,
        showPage,
        currentPage: () => currentPageKey,
        button: buttonByKey,
        destroy() {
          observer?.disconnect();
          root.removeEventListener('click', clickHandler);
        }
      });
    }

    window.AppMobileBottomBar = Object.freeze({ mount: mountMobileBottomBar });
  })();

</script>
